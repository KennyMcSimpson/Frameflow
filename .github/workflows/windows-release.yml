name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload artifacts without creating a GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Desktop Release (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Fetch LGPL FFmpeg binaries
        run: npm run fetch:ffmpeg

      - name: Fetch and synthesize built-in audio
        run: npm run fetch:builtin-audio

      - name: Fetch optional sample media (best-effort)
        continue-on-error: true
        shell: pwsh
        run: |
          npm run fetch:sample-media
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $mp4s = Get-ChildItem -Path "build/sample-media" -Filter "*.mp4" -File -ErrorAction SilentlyContinue
            if (-not $mp4s -or $mp4s.Count -eq 0) {
              $manifestPath = "build/sample-media/manifest.json"
              if (Test-Path -Path $manifestPath) {
                Remove-Item -Path $manifestPath -Force
              }
              Write-Host "::warning::Optional sample media fetch failed (exit $exitCode; e.g. Mixkit rate-limiting on CI runners) and no .mp4 files exist in build/sample-media; removed orphaned build/sample-media/manifest.json from CI workspace so electron-builder continues without bundled sample media."
            } else {
              Write-Host "::warning::Optional sample media fetch failed (exit $exitCode; e.g. Mixkit rate-limiting on CI runners); continuing with existing sample media files."
            }
            exit $exitCode
          }

      - name: Build renderer
        run: npm run build:renderer

      - name: Generate third-party licenses and privacy notice
        run: npm run gen:licenses

      - name: Package Windows installer and portable build
        run: npx electron-builder --win --publish never

      - name: Check packaged release artifacts
        run: npm run check:artifacts

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path "dist" -Filter "*.exe" -File | Sort-Object Name
          if (-not $exes -or $exes.Count -eq 0) {
            throw "No .exe artifacts found in dist/"
          }
          $lines = foreach ($exe in $exes) {
            $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($exe.Name)"
          }
          $outPath = Join-Path (Resolve-Path "dist").Path "SHA256SUMS.txt"
          [System.IO.File]::WriteAllText($outPath, ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content -Path $outPath

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frameflow-windows-x64
          path: release-assets

      - name: Verify downloaded artifact checksums
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
