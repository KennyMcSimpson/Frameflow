<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" width="1200" height="396" role="img" aria-labelledby="arch-light-title arch-light-desc">
  <title id="arch-light-title">Frameflow v2.1 Electron Security, Media and Agent Architecture</title>
  <desc id="arch-light-desc">Four-layer Electron 45 architecture showing the sandboxed Renderer Process with bilingual i18n, Security Boundary with 5 protections, Main Process with 9 IPC modules, encrypted secret store, Live Watch and agent adapters, and 4 local, agent, and external capability engines.</desc>
  <defs>
    <linearGradient id="al-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafbf9"/>
      <stop offset="100%" stop-color="#f1f5ee"/>
    </linearGradient>
    <clipPath id="al-outer-clip">
      <rect x="4" y="4" width="1192" height="388" rx="18"/>
    </clipPath>
    <clipPath id="al-renderer-clip">
      <rect x="0" y="0" width="1148" height="86" rx="13"/>
    </clipPath>
    <clipPath id="al-main-clip">
      <rect x="0" y="0" width="1148" height="92" rx="13"/>
    </clipPath>
    <pattern id="al-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2e05" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Card Canvas -->
  <g clip-path="url(#al-outer-clip)">
    <rect x="4" y="4" width="1192" height="388" fill="url(#al-bg)"/>
    <rect x="4" y="4" width="1192" height="388" fill="url(#al-grid)"/>
  </g>
  <rect x="4" y="4" width="1192" height="388" rx="18" fill="none" stroke="#d5ddd0" stroke-width="1.5"/>
  <rect x="5.5" y="5.5" width="1189" height="385" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <circle cx="31" cy="27" r="3.5" fill="#65a30d"/>
    <text x="43" y="31" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#4d7c0f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">ELECTRON SECURITY, MEDIA &amp; AGENT ARCHITECTURE</text>
    <text x="1172" y="31" text-anchor="end" font-size="11.5" font-weight="500" fill="#475569">Electron 45 · React 19 · i18n · Agent CLI/MCP · LGPL v3 FFmpeg</text>
  </g>

  <!-- LAYER 1: RENDERER PROCESS -->
  <g transform="translate(26, 44)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="2.5" width="1148" height="86" rx="13" fill="#1a2e05" fill-opacity="0.04"/>
    <g clip-path="url(#al-renderer-clip)">
      <rect x="0" y="0" width="1148" height="86" fill="#ffffff"/>
      <rect x="0" y="0" width="5" height="86" fill="#0284c7"/>
    </g>
    <rect x="0" y="0" width="1148" height="86" rx="13" fill="none" stroke="#dce4d8" stroke-width="1.2"/>

    <text x="20" y="31" font-size="14.5" font-weight="700" fill="#11161d">Renderer Process</text>
    <text x="20" y="50" font-size="11.2" font-weight="500" fill="#0369a1">Sandboxed React 19 · Vite · i18n</text>
    <text x="20" y="68" font-size="10.2" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">No Node · EN/ZH · IPC APIs</text>

    <!-- Renderer Module 1 -->
    <rect x="244" y="12" width="288" height="62" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="258" y="34" font-size="13" font-weight="700" fill="#11161d">Pure Editing Engine <tspan font-size="10.8" font-weight="600" fill="#0369a1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">src/engine</tspan></text>
    <text x="258" y="55" font-size="11.3" fill="#475569">Atomic ops, timeline, keyframes, NLP</text>

    <!-- Renderer Module 2 -->
    <rect x="546" y="12" width="290" height="62" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="560" y="34" font-size="13" font-weight="700" fill="#11161d">Compositor &amp; Export <tspan font-size="10.8" font-weight="600" fill="#0369a1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">render/export</tspan></text>
    <text x="560" y="55" font-size="11.3" fill="#475569">Canvas2D renderer + Worker JPEG pipe</text>

    <!-- Renderer Module 3 -->
    <rect x="850" y="12" width="284" height="62" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="864" y="34" font-size="13" font-weight="700" fill="#11161d">AI Orchestrator <tspan font-size="10.8" font-weight="600" fill="#0369a1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">src/ai</tspan></text>
    <text x="864" y="55" font-size="11.3" fill="#475569">Strict JSON schemas, director &amp; editor</text>
  </g>

  <!-- Vertical Connectors 1 <-> 2 -->
  <g stroke="#65a30d" stroke-opacity="0.72" stroke-width="1.5">
    <line x1="414" y1="130" x2="414" y2="144"/>
    <line x1="717" y1="130" x2="717" y2="144"/>
    <line x1="1018" y1="130" x2="1018" y2="144"/>
  </g>
  <g fill="#4d7c0f">
    <circle cx="414" cy="130" r="2.2"/>
    <circle cx="717" cy="130" r="2.2"/>
    <circle cx="1018" cy="130" r="2.2"/>
  </g>

  <!-- LAYER 2: SECURITY BOUNDARY -->
  <g transform="translate(26, 144)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1148" height="46" rx="11" fill="#ecfccb" stroke="#65a30d" stroke-opacity="0.72" stroke-width="1.3" stroke-dasharray="6 4"/>
    <circle cx="20" cy="23" r="4.2" fill="#4d7c0f"/>
    <text x="32" y="27" font-size="11" font-weight="700" letter-spacing="1.0" fill="#1a2e05" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">SECURITY BOUNDARY</text>

    <!-- 5 Security Pills across x=204..1134 -->
    <rect x="204" y="10" width="190" height="26" rx="13" fill="#ffffff" stroke="#84cc16" stroke-width="1"/>
    <text x="299" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e05">contextIsolation + sandbox</text>

    <rect x="404" y="10" width="122" height="26" rx="13" fill="#ffffff" stroke="#84cc16" stroke-width="1"/>
    <text x="465" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e05">Hardened CSP</text>

    <rect x="536" y="10" width="236" height="26" rx="13" fill="#ffffff" stroke="#84cc16" stroke-width="1"/>
    <text x="654" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e05">window.ff Preload + Sender Check</text>

    <rect x="782" y="10" width="196" height="26" rx="13" fill="#ffffff" stroke="#84cc16" stroke-width="1"/>
    <text x="880" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e05">Strict ffmedia:// Protocol</text>

    <rect x="988" y="10" width="146" height="26" rx="13" fill="#ffffff" stroke="#84cc16" stroke-width="1"/>
    <text x="1061" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e05">5 Electron Fuses</text>
  </g>

  <!-- Vertical Connectors 2 <-> 3 -->
  <g stroke="#7c3aed" stroke-opacity="0.65" stroke-width="1.5">
    <line x1="414" y1="190" x2="414" y2="204"/>
    <line x1="717" y1="190" x2="717" y2="204"/>
    <line x1="1018" y1="190" x2="1018" y2="204"/>
  </g>
  <g fill="#7c3aed">
    <circle cx="414" cy="204" r="2.2"/>
    <circle cx="717" cy="204" r="2.2"/>
    <circle cx="1018" cy="204" r="2.2"/>
  </g>

  <!-- LAYER 3: MAIN PROCESS -->
  <g transform="translate(26, 204)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="2.5" width="1148" height="92" rx="13" fill="#1a2e05" fill-opacity="0.04"/>
    <g clip-path="url(#al-main-clip)">
      <rect x="0" y="0" width="1148" height="92" fill="#ffffff"/>
      <rect x="0" y="0" width="5" height="92" fill="#7c3aed"/>
    </g>
    <rect x="0" y="0" width="1148" height="92" rx="13" fill="none" stroke="#dce4d8" stroke-width="1.2"/>

    <text x="20" y="34" font-size="14.5" font-weight="700" fill="#11161d">Main Process</text>
    <text x="20" y="54" font-size="11.2" font-weight="500" fill="#6d28d9">Electron 45 + Node.js (CommonJS)</text>
    <text x="20" y="73" font-size="10.2" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Live Watch · Crash recovery</text>

    <!-- Main Module 1 -->
    <rect x="244" y="11" width="316" height="70" rx="9" fill="#faf9ff" stroke="#ddd6fe"/>
    <text x="258" y="30" font-size="13" font-weight="700" fill="#11161d">9 IPC Modules <tspan font-size="10.8" font-weight="600" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">electron/ipc/</tspan></text>
    <text x="258" y="49" font-size="10.6" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">store · media · export · ai · videogen</text>
    <text x="258" y="66" font-size="10.6" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">asr · analysis · web · system</text>

    <!-- Main Module 2 -->
    <rect x="574" y="11" width="274" height="70" rx="9" fill="#faf9ff" stroke="#ddd6fe"/>
    <text x="588" y="30" font-size="13" font-weight="700" fill="#11161d">Encrypted Store &amp; Watch</text>
    <text x="588" y="49" font-size="11.2" fill="#475569">DPAPI secrets · Atomic JSON + .bak</text>
    <text x="588" y="66" font-size="11.2" fill="#475569">Live Watch (&lt;100ms) + Ctrl+Z sync</text>

    <!-- Main Module 3 -->
    <rect x="862" y="11" width="272" height="70" rx="9" fill="#faf9ff" stroke="#ddd6fe"/>
    <text x="876" y="30" font-size="13" font-weight="700" fill="#11161d">Jobs, Presets &amp; Agent CLIs</text>
    <text x="876" y="49" font-size="11.2" fill="#475569">Abortable queue · worker_threads</text>
    <text x="876" y="66" font-size="11.2" fill="#475569">aiPresets · agentCli · FFmpeg pool</text>
  </g>

  <!-- Vertical Connectors 3 <-> 4 -->
  <g stroke="#059669" stroke-opacity="0.62" stroke-width="1.5">
    <line x1="159" y1="296" x2="159" y2="310"/>
    <line x1="455" y1="296" x2="455" y2="310"/>
    <line x1="757" y1="296" x2="757" y2="310"/>
    <line x1="1042" y1="296" x2="1042" y2="310"/>
  </g>
  <g fill="#059669">
    <circle cx="159" cy="310" r="2.2"/>
    <circle cx="455" cy="310" r="2.2"/>
    <circle cx="757" cy="310" r="2.2"/>
    <circle cx="1042" cy="310" r="2.2"/>
  </g>

  <!-- LAYER 4: 4 BOTTOM CAPABILITY CARDS -->
  <g transform="translate(26, 310)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Capability 1 -->
    <rect x="0" y="2.5" width="266" height="66" rx="11" fill="#1a2e05" fill-opacity="0.04"/>
    <rect x="0" y="0" width="266" height="66" rx="11" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
    <circle cx="18" cy="24" r="4" fill="#059669"/>
    <text x="30" y="28" font-size="12.5" font-weight="700" fill="#11161d">Bundled LGPL v3 FFmpeg</text>
    <text x="16" y="49" font-size="10.9" fill="#475569">FFmpeg/FFprobe · NVENC/QSV/AMF/MF</text>

    <!-- Capability 2 -->
    <rect x="280" y="2.5" width="298" height="66" rx="11" fill="#1a2e05" fill-opacity="0.04"/>
    <rect x="280" y="0" width="298" height="66" rx="11" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
    <circle cx="298" cy="24" r="4" fill="#059669"/>
    <text x="310" y="28" font-size="12.5" font-weight="700" fill="#11161d">Agent CLI · Live Watch · Thin MCP</text>
    <text x="296" y="49" font-size="10.9" fill="#475569">frameflow CLI · SKILL.md · MCP stdio</text>

    <!-- Capability 3 -->
    <rect x="592" y="2.5" width="278" height="66" rx="11" fill="#1a2e05" fill-opacity="0.04"/>
    <rect x="592" y="0" width="278" height="66" rx="11" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
    <circle cx="610" cy="24" r="4" fill="#059669"/>
    <text x="622" y="28" font-size="12.5" font-weight="700" fill="#11161d">Neutral LLM/CLI &amp; VideoGen</text>
    <text x="608" y="49" font-size="10.9" fill="#475569">8 API Presets · 3 CLIs · 8 VideoGen</text>

    <!-- Capability 4 -->
    <rect x="884" y="2.5" width="264" height="66" rx="11" fill="#1a2e05" fill-opacity="0.04"/>
    <rect x="884" y="0" width="264" height="66" rx="11" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
    <circle cx="902" cy="24" r="4" fill="#059669"/>
    <text x="914" y="28" font-size="12.5" font-weight="700" fill="#11161d">Local ASR &amp; Free Stock APIs</text>
    <text x="900" y="49" font-size="10.9" fill="#475569">whisper.cpp · Zero-Key Stock · yt-dlp</text>
  </g>
</svg>
