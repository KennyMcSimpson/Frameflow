<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" width="1200" height="396" role="img" aria-label="Frameflow Studio Layered Electron Security and Media Architecture">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="layerBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171b23"/>
      <stop offset="100%" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="1192" height="388" rx="18" fill="url(#archBg)" stroke="#2c3340" stroke-width="1.5"/>

  <!-- Header -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="28" y="31" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#c8e250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ELECTRON SECURITY &amp; MEDIA ARCHITECTURE</text>
    <text x="1172" y="31" text-anchor="end" font-size="11.5" font-weight="500" fill="#8e95a3">Electron 45 · React 19 · Vite 7 · Zustand 5 · LGPL v3 FFmpeg</text>
  </g>

  <!-- LAYER 1: RENDERER PROCESS -->
  <g transform="translate(26, 44)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="1148" height="86" rx="13" fill="url(#layerBox)" stroke="#6cb2ff" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="86" rx="2.5" fill="#6cb2ff"/>

    <text x="20" y="32" font-size="14.5" font-weight="700" fill="#f3f5f8">Renderer Process</text>
    <text x="20" y="51" font-size="11.5" fill="#8fbef0">Sandboxed React 19 + Vite + Zustand</text>
    <text x="20" y="69" font-size="10.5" fill="#7c8494" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">No Node · IPC APIs · HTTPS media</text>

    <!-- Renderer Module 1 -->
    <rect x="242" y="12" width="290" height="62" rx="9" fill="#0f131a" stroke="#6cb2ff" stroke-opacity="0.24"/>
    <text x="256" y="34" font-size="13" font-weight="700" fill="#e8edf5">Pure Editing Engine <tspan font-size="11" font-weight="500" fill="#6cb2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/engine</tspan></text>
    <text x="256" y="55" font-size="11.5" fill="#9aa3b2">Atomic ops, timeline, keyframes, NLP</text>

    <!-- Renderer Module 2 -->
    <rect x="546" y="12" width="290" height="62" rx="9" fill="#0f131a" stroke="#6cb2ff" stroke-opacity="0.24"/>
    <text x="560" y="34" font-size="13" font-weight="700" fill="#e8edf5">Compositor &amp; Export <tspan font-size="11" font-weight="500" fill="#6cb2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">render/export</tspan></text>
    <text x="560" y="55" font-size="11.5" fill="#9aa3b2">Canvas2D renderer + Worker JPEG pipe</text>

    <!-- Renderer Module 3 -->
    <rect x="850" y="12" width="284" height="62" rx="9" fill="#0f131a" stroke="#6cb2ff" stroke-opacity="0.24"/>
    <text x="864" y="34" font-size="13" font-weight="700" fill="#e8edf5">AI Orchestrator <tspan font-size="11" font-weight="500" fill="#6cb2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/ai</tspan></text>
    <text x="864" y="55" font-size="11.5" fill="#9aa3b2">Strict JSON schemas, director &amp; editor</text>
  </g>

  <!-- Vertical Connectors 1 <-> 2 -->
  <g stroke="#c8e250" stroke-opacity="0.55" stroke-width="1.5">
    <line x1="412" y1="130" x2="412" y2="144"/>
    <line x1="716" y1="130" x2="716" y2="144"/>
    <line x1="1018" y1="130" x2="1018" y2="144"/>
  </g>

  <!-- LAYER 2: SECURITY BOUNDARY -->
  <g transform="translate(26, 144)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="1148" height="46" rx="11" fill="#171b12" stroke="#c8e250" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="6 4"/>
    <circle cx="22" cy="23" r="4.5" fill="#d4ff3f"/>
    <text x="35" y="27" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#d4ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SECURITY BOUNDARY</text>

    <!-- 5 Security Pills across x=212..1134 -->
    <rect x="212" y="10" width="186" height="26" rx="13" fill="#0f130d" stroke="#c8e250" stroke-opacity="0.32"/>
    <text x="305" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e6f2b3">contextIsolation + sandbox</text>

    <rect x="408" y="10" width="128" height="26" rx="13" fill="#0f130d" stroke="#c8e250" stroke-opacity="0.32"/>
    <text x="472" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e6f2b3">Hardened CSP</text>

    <rect x="546" y="10" width="222" height="26" rx="13" fill="#0f130d" stroke="#c8e250" stroke-opacity="0.32"/>
    <text x="657" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e6f2b3">window.ff Preload + Sender Check</text>

    <rect x="778" y="10" width="194" height="26" rx="13" fill="#0f130d" stroke="#c8e250" stroke-opacity="0.32"/>
    <text x="875" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e6f2b3">Strict ffmedia:// Protocol</text>

    <rect x="982" y="10" width="152" height="26" rx="13" fill="#0f130d" stroke="#c8e250" stroke-opacity="0.32"/>
    <text x="1058" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e6f2b3">5 Electron Fuses</text>
  </g>

  <!-- Vertical Connectors 2 <-> 3 -->
  <g stroke="#9d8cff" stroke-opacity="0.6" stroke-width="1.5">
    <line x1="412" y1="190" x2="412" y2="204"/>
    <line x1="716" y1="190" x2="716" y2="204"/>
    <line x1="1018" y1="190" x2="1018" y2="204"/>
  </g>

  <!-- LAYER 3: MAIN PROCESS -->
  <g transform="translate(26, 204)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="1148" height="92" rx="13" fill="url(#layerBox)" stroke="#9d8cff" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#9d8cff"/>

    <text x="20" y="34" font-size="14.5" font-weight="700" fill="#f3f5f8">Main Process</text>
    <text x="20" y="54" font-size="11.5" fill="#bfb2ff">Electron 45 + Node.js (CommonJS)</text>
    <text x="20" y="73" font-size="10.5" fill="#7c8494" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Single-instance · Crash recovery</text>

    <!-- Main Module 1 (two tidy lines for IPC list — zero overflow) -->
    <rect x="242" y="11" width="318" height="70" rx="9" fill="#12111d" stroke="#9d8cff" stroke-opacity="0.26"/>
    <text x="256" y="30" font-size="13" font-weight="700" fill="#e8edf5">9 IPC Modules <tspan font-size="11" font-weight="500" fill="#b3a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">electron/ipc/</tspan></text>
    <text x="256" y="49" font-size="11" fill="#a8b0bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">store · media · export · ai · videogen</text>
    <text x="256" y="66" font-size="11" fill="#a8b0bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">asr · analysis · web · system</text>

    <!-- Main Module 2 -->
    <rect x="574" y="11" width="274" height="70" rx="9" fill="#12111d" stroke="#9d8cff" stroke-opacity="0.26"/>
    <text x="588" y="30" font-size="13" font-weight="700" fill="#e8edf5">Encrypted Secret Store</text>
    <text x="588" y="49" font-size="11.5" fill="#9aa3b2">Electron safeStorage (Windows DPAPI)</text>
    <text x="588" y="66" font-size="11.5" fill="#9aa3b2">Atomic JSON persistence + .bak</text>

    <!-- Main Module 3 -->
    <rect x="862" y="11" width="272" height="70" rx="9" fill="#12111d" stroke="#9d8cff" stroke-opacity="0.26"/>
    <text x="876" y="30" font-size="13" font-weight="700" fill="#e8edf5">Jobs &amp; Subprocess Pool</text>
    <text x="876" y="49" font-size="11.5" fill="#9aa3b2">Abortable job queue · worker_threads</text>
    <text x="876" y="66" font-size="11.5" fill="#9aa3b2">Managed FFmpeg &amp; process cleanup</text>
  </g>

  <!-- Vertical Connectors 3 <-> 4 -->
  <g stroke="#4cc38a" stroke-opacity="0.55" stroke-width="1.5">
    <line x1="164" y1="296" x2="164" y2="310"/>
    <line x1="454" y1="296" x2="454" y2="310"/>
    <line x1="744" y1="296" x2="744" y2="310"/>
    <line x1="1034" y1="296" x2="1034" y2="310"/>
  </g>

  <!-- LAYER 4: EXTERNAL & LOCAL ENGINES -->
  <g transform="translate(26, 310)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Engine 1 -->
    <rect x="0" y="0" width="276" height="66" rx="11" fill="#111917" stroke="#4cc38a" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="18" cy="24" r="4" fill="#4cc38a"/>
    <text x="30" y="28" font-size="13" font-weight="700" fill="#edf4f0">Bundled LGPL v3 FFmpeg</text>
    <text x="16" y="49" font-size="11.5" fill="#96ada2">FFmpeg/FFprobe · NVENC/QSV/AMF/MF</text>

    <!-- Engine 2 -->
    <rect x="290" y="0" width="276" height="66" rx="11" fill="#111917" stroke="#4cc38a" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="308" cy="24" r="4" fill="#4cc38a"/>
    <text x="320" y="28" font-size="13" font-weight="700" fill="#edf4f0">Local ASR &amp; Media Tools</text>
    <text x="306" y="49" font-size="11.5" fill="#96ada2">whisper.cpp / Whisper · Optional yt-dlp</text>

    <!-- Engine 3 -->
    <rect x="580" y="0" width="276" height="66" rx="11" fill="#111917" stroke="#4cc38a" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="598" cy="24" r="4" fill="#4cc38a"/>
    <text x="610" y="28" font-size="13" font-weight="700" fill="#edf4f0">LLM &amp; VideoGen APIs</text>
    <text x="596" y="49" font-size="11.5" fill="#96ada2">OpenAI / Codex · Ark · 8 VideoGen APIs</text>

    <!-- Engine 4 -->
    <rect x="870" y="0" width="278" height="66" rx="11" fill="#111917" stroke="#4cc38a" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="888" cy="24" r="4" fill="#4cc38a"/>
    <text x="900" y="28" font-size="13" font-weight="700" fill="#edf4f0">Free &amp; Opt-In Stock APIs</text>
    <text x="886" y="49" font-size="11.5" fill="#96ada2">Wikimedia, Openverse, Archive, NASA</text>
  </g>
</svg>
