<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" width="1200" height="396" role="img" aria-labelledby="arch-dark-title arch-dark-desc">
  <title id="arch-dark-title">Frameflow Electron Security and Media Architecture</title>
  <desc id="arch-dark-desc">Four-layer Electron 45 architecture showing the sandboxed Renderer Process, Security Boundary with 5 protections, Main Process with 9 IPC modules and encrypted secret store, and 4 local and external media capability engines.</desc>
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="ad-layer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171b24"/>
      <stop offset="100%" stop-color="#12161d"/>
    </linearGradient>
    <clipPath id="ad-outer-clip">
      <rect x="4" y="4" width="1192" height="388" rx="18"/>
    </clipPath>
    <clipPath id="ad-renderer-clip">
      <rect x="0" y="0" width="1148" height="86" rx="13"/>
    </clipPath>
    <clipPath id="ad-main-clip">
      <rect x="0" y="0" width="1148" height="92" rx="13"/>
    </clipPath>
    <pattern id="ad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Card Canvas -->
  <g clip-path="url(#ad-outer-clip)">
    <rect x="4" y="4" width="1192" height="388" fill="url(#ad-bg)"/>
    <rect x="4" y="4" width="1192" height="388" fill="url(#ad-grid)"/>
  </g>
  <rect x="4" y="4" width="1192" height="388" rx="18" fill="none" stroke="#242b35" stroke-width="1.5"/>
  <rect x="5.5" y="5.5" width="1189" height="385" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <circle cx="31" cy="27" r="3.5" fill="#d4ff3f"/>
    <text x="43" y="31" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#d4ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">ELECTRON SECURITY &amp; MEDIA ARCHITECTURE</text>
    <text x="1172" y="31" text-anchor="end" font-size="11.5" font-weight="500" fill="#9aa6b8">Electron 45 · React 19 · Vite 7 · Zustand 5 · LGPL v3 FFmpeg</text>
  </g>

  <!-- LAYER 1: RENDERER PROCESS -->
  <g transform="translate(26, 44)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g clip-path="url(#ad-renderer-clip)">
      <rect x="0" y="0" width="1148" height="86" fill="url(#ad-layer)"/>
      <rect x="0" y="0" width="5" height="86" fill="#6cb2ff"/>
    </g>
    <rect x="0" y="0" width="1148" height="86" rx="13" fill="none" stroke="#6cb2ff" stroke-opacity="0.40" stroke-width="1.2"/>

    <text x="20" y="31" font-size="14.5" font-weight="700" fill="#f4f7fb">Renderer Process</text>
    <text x="20" y="50" font-size="11.2" fill="#8fbef0">Sandboxed React 19 + Vite + Zustand</text>
    <text x="20" y="68" font-size="10.2" fill="#9aa6b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">No Node · IPC APIs · HTTPS media</text>

    <!-- Renderer Module 1 -->
    <rect x="244" y="12" width="288" height="62" rx="9" fill="#0e131a" stroke="#6cb2ff" stroke-opacity="0.26"/>
    <text x="258" y="34" font-size="13" font-weight="700" fill="#eef3fa">Pure Editing Engine <tspan font-size="10.8" font-weight="500" fill="#7ec0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">src/engine</tspan></text>
    <text x="258" y="55" font-size="11.3" fill="#9aa6b8">Atomic ops, timeline, keyframes, NLP</text>

    <!-- Renderer Module 2 -->
    <rect x="546" y="12" width="290" height="62" rx="9" fill="#0e131a" stroke="#6cb2ff" stroke-opacity="0.26"/>
    <text x="560" y="34" font-size="13" font-weight="700" fill="#eef3fa">Compositor &amp; Export <tspan font-size="10.8" font-weight="500" fill="#7ec0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">render/export</tspan></text>
    <text x="560" y="55" font-size="11.3" fill="#9aa6b8">Canvas2D renderer + Worker JPEG pipe</text>

    <!-- Renderer Module 3 -->
    <rect x="850" y="12" width="284" height="62" rx="9" fill="#0e131a" stroke="#6cb2ff" stroke-opacity="0.26"/>
    <text x="864" y="34" font-size="13" font-weight="700" fill="#eef3fa">AI Orchestrator <tspan font-size="10.8" font-weight="500" fill="#7ec0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">src/ai</tspan></text>
    <text x="864" y="55" font-size="11.3" fill="#9aa6b8">Strict JSON schemas, director &amp; editor</text>
  </g>

  <!-- Vertical Connectors 1 <-> 2 -->
  <g stroke="#a3e635" stroke-opacity="0.62" stroke-width="1.5">
    <line x1="414" y1="130" x2="414" y2="144"/>
    <line x1="717" y1="130" x2="717" y2="144"/>
    <line x1="1018" y1="130" x2="1018" y2="144"/>
  </g>
  <g fill="#d4ff3f">
    <circle cx="414" cy="130" r="2.2"/>
    <circle cx="717" cy="130" r="2.2"/>
    <circle cx="1018" cy="130" r="2.2"/>
  </g>

  <!-- LAYER 2: SECURITY BOUNDARY -->
  <g transform="translate(26, 144)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1148" height="46" rx="11" fill="#161c11" stroke="#a3e635" stroke-opacity="0.58" stroke-width="1.3" stroke-dasharray="6 4"/>
    <circle cx="20" cy="23" r="4.2" fill="#d4ff3f"/>
    <text x="32" y="27" font-size="11" font-weight="700" letter-spacing="1.0" fill="#d4ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">SECURITY BOUNDARY</text>

    <!-- 5 Security Pills across x=204..1134 -->
    <rect x="204" y="10" width="190" height="26" rx="13" fill="#0f140c" stroke="#a3e635" stroke-opacity="0.38"/>
    <text x="299" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e8f7b5">contextIsolation + sandbox</text>

    <rect x="404" y="10" width="122" height="26" rx="13" fill="#0f140c" stroke="#a3e635" stroke-opacity="0.38"/>
    <text x="465" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e8f7b5">Hardened CSP</text>

    <rect x="536" y="10" width="236" height="26" rx="13" fill="#0f140c" stroke="#a3e635" stroke-opacity="0.38"/>
    <text x="654" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e8f7b5">window.ff Preload + Sender Check</text>

    <rect x="782" y="10" width="196" height="26" rx="13" fill="#0f140c" stroke="#a3e635" stroke-opacity="0.38"/>
    <text x="880" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e8f7b5">Strict ffmedia:// Protocol</text>

    <rect x="988" y="10" width="146" height="26" rx="13" fill="#0f140c" stroke="#a3e635" stroke-opacity="0.38"/>
    <text x="1061" y="26.5" text-anchor="middle" font-size="11" font-weight="600" fill="#e8f7b5">5 Electron Fuses</text>
  </g>

  <!-- Vertical Connectors 2 <-> 3 -->
  <g stroke="#9d8cff" stroke-opacity="0.65" stroke-width="1.5">
    <line x1="414" y1="190" x2="414" y2="204"/>
    <line x1="717" y1="190" x2="717" y2="204"/>
    <line x1="1018" y1="190" x2="1018" y2="204"/>
  </g>
  <g fill="#9d8cff">
    <circle cx="414" cy="204" r="2.2"/>
    <circle cx="717" cy="204" r="2.2"/>
    <circle cx="1018" cy="204" r="2.2"/>
  </g>

  <!-- LAYER 3: MAIN PROCESS -->
  <g transform="translate(26, 204)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g clip-path="url(#ad-main-clip)">
      <rect x="0" y="0" width="1148" height="92" fill="url(#ad-layer)"/>
      <rect x="0" y="0" width="5" height="92" fill="#9d8cff"/>
    </g>
    <rect x="0" y="0" width="1148" height="92" rx="13" fill="none" stroke="#9d8cff" stroke-opacity="0.42" stroke-width="1.2"/>

    <text x="20" y="34" font-size="14.5" font-weight="700" fill="#f4f7fb">Main Process</text>
    <text x="20" y="54" font-size="11.2" fill="#c3b7ff">Electron 45 + Node.js (CommonJS)</text>
    <text x="20" y="73" font-size="10.2" fill="#9aa6b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Single-instance · Crash recovery</text>

    <!-- Main Module 1 -->
    <rect x="244" y="11" width="316" height="70" rx="9" fill="#12111e" stroke="#9d8cff" stroke-opacity="0.28"/>
    <text x="258" y="30" font-size="13" font-weight="700" fill="#eef3fa">9 IPC Modules <tspan font-size="10.8" font-weight="500" fill="#b8adff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">electron/ipc/</tspan></text>
    <text x="258" y="49" font-size="10.6" fill="#aeb8c8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">store · media · export · ai · videogen</text>
    <text x="258" y="66" font-size="10.6" fill="#aeb8c8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">asr · analysis · web · system</text>

    <!-- Main Module 2 -->
    <rect x="574" y="11" width="274" height="70" rx="9" fill="#12111e" stroke="#9d8cff" stroke-opacity="0.28"/>
    <text x="588" y="30" font-size="13" font-weight="700" fill="#eef3fa">Encrypted Secret Store</text>
    <text x="588" y="49" font-size="11.3" fill="#9aa6b8">Electron safeStorage (Windows DPAPI)</text>
    <text x="588" y="66" font-size="11.3" fill="#9aa6b8">Atomic JSON persistence + .bak</text>

    <!-- Main Module 3 -->
    <rect x="862" y="11" width="272" height="70" rx="9" fill="#12111e" stroke="#9d8cff" stroke-opacity="0.28"/>
    <text x="876" y="30" font-size="13" font-weight="700" fill="#eef3fa">Jobs &amp; Subprocess Pool</text>
    <text x="876" y="49" font-size="11.3" fill="#9aa6b8">Abortable job queue · worker_threads</text>
    <text x="876" y="66" font-size="11.3" fill="#9aa6b8">Managed FFmpeg &amp; process cleanup</text>
  </g>

  <!-- Vertical Connectors 3 <-> 4 -->
  <g stroke="#4cc38a" stroke-opacity="0.60" stroke-width="1.5">
    <line x1="164" y1="296" x2="164" y2="310"/>
    <line x1="454" y1="296" x2="454" y2="310"/>
    <line x1="744" y1="296" x2="744" y2="310"/>
    <line x1="1035" y1="296" x2="1035" y2="310"/>
  </g>
  <g fill="#4cc38a">
    <circle cx="164" cy="310" r="2.2"/>
    <circle cx="454" cy="310" r="2.2"/>
    <circle cx="744" cy="310" r="2.2"/>
    <circle cx="1035" cy="310" r="2.2"/>
  </g>

  <!-- LAYER 4: 4 BOTTOM CAPABILITY CARDS -->
  <g transform="translate(26, 310)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Capability 1 -->
    <rect x="0" y="0" width="276" height="66" rx="11" fill="#111a17" stroke="#4cc38a" stroke-opacity="0.40" stroke-width="1.2"/>
    <circle cx="18" cy="24" r="4" fill="#4cc38a"/>
    <text x="30" y="28" font-size="13" font-weight="700" fill="#f1f7f4">Bundled LGPL v3 FFmpeg</text>
    <text x="16" y="49" font-size="11.2" fill="#99b3a7">FFmpeg/FFprobe · NVENC/QSV/AMF/MF</text>

    <!-- Capability 2 -->
    <rect x="290" y="0" width="276" height="66" rx="11" fill="#111a17" stroke="#4cc38a" stroke-opacity="0.40" stroke-width="1.2"/>
    <circle cx="308" cy="24" r="4" fill="#4cc38a"/>
    <text x="320" y="28" font-size="13" font-weight="700" fill="#f1f7f4">Local ASR &amp; Media Tools</text>
    <text x="306" y="49" font-size="11.2" fill="#99b3a7">whisper.cpp / Whisper · Optional yt-dlp</text>

    <!-- Capability 3 -->
    <rect x="580" y="0" width="276" height="66" rx="11" fill="#111a17" stroke="#4cc38a" stroke-opacity="0.40" stroke-width="1.2"/>
    <circle cx="598" cy="24" r="4" fill="#4cc38a"/>
    <text x="610" y="28" font-size="13" font-weight="700" fill="#f1f7f4">LLM &amp; VideoGen APIs</text>
    <text x="596" y="49" font-size="11.2" fill="#99b3a7">OpenAI / Codex · Ark · 8 VideoGen APIs</text>

    <!-- Capability 4 -->
    <rect x="870" y="0" width="278" height="66" rx="11" fill="#111a17" stroke="#4cc38a" stroke-opacity="0.40" stroke-width="1.2"/>
    <circle cx="888" cy="24" r="4" fill="#4cc38a"/>
    <text x="900" y="28" font-size="13" font-weight="700" fill="#f1f7f4">Free &amp; Opt-In Stock APIs</text>
    <text x="886" y="49" font-size="11.2" fill="#99b3a7">Wikimedia, Openverse, Archive, NASA</text>
  </g>
</svg>
