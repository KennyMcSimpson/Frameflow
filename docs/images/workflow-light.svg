<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="wf-light-title wf-light-desc">
  <title id="wf-light-title">Frameflow 4-Stage Video Production Workflow</title>
  <desc id="wf-light-desc">Four-stage production pipeline: 01 Create, 02 Refine, 03 Breakdown, and 04 Export, with a closed-loop feedback path where Technique Cards feed back into Create and Refine AI.</desc>
  <defs>
    <linearGradient id="wfl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafbf9"/>
      <stop offset="100%" stop-color="#f1f5ee"/>
    </linearGradient>
    <linearGradient id="wfl-arr1" x1="292" y1="158" x2="314" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wfl-arr2" x1="586" y1="158" x2="608" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="wfl-arr3" x1="880" y1="158" x2="902" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="wfl-outer-clip">
      <rect x="4" y="4" width="1192" height="312" rx="18"/>
    </clipPath>
    <clipPath id="wfl-stage-clip">
      <rect x="0" y="0" width="262" height="216" rx="14"/>
    </clipPath>
    <pattern id="wfl-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2e05" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Card Canvas -->
  <g clip-path="url(#wfl-outer-clip)">
    <rect x="4" y="4" width="1192" height="312" fill="url(#wfl-bg)"/>
    <rect x="4" y="4" width="1192" height="312" fill="url(#wfl-grid)"/>
  </g>
  <rect x="4" y="4" width="1192" height="312" rx="18" fill="none" stroke="#d5ddd0" stroke-width="1.5"/>
  <rect x="5.5" y="5.5" width="1189" height="309" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Header Strip -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <circle cx="33" cy="29.5" r="3.5" fill="#65a30d"/>
    <text x="45" y="33.5" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#4d7c0f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">END-TO-END PRODUCTION WORKFLOW</text>
    <text x="1172" y="33.5" text-anchor="end" font-size="12" font-weight="500" fill="#475569">Create · Refine · Breakdown Library · Hardware-Accelerated Export</text>
  </g>

  <!-- STAGE 1: 01 CREATE -->
  <g transform="translate(28, 50)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="3" width="262" height="216" rx="14" fill="#1a2e05" fill-opacity="0.045"/>
    <g clip-path="url(#wfl-stage-clip)">
      <rect x="0" y="0" width="262" height="216" fill="#ffffff"/>
      <rect x="0" y="0" width="262" height="4" fill="#65a30d"/>
    </g>
    <rect x="0" y="0" width="262" height="216" rx="14" fill="none" stroke="#dce4d8" stroke-width="1.2"/>

    <rect x="16" y="16" width="44" height="20" rx="10" fill="#ecfccb" stroke="#bef264" stroke-width="0.9"/>
    <text x="38" y="29.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a2e05" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">01</text>
    <text x="70" y="31" font-size="16" font-weight="700" fill="#11161d">Create</text>
    <text x="16" y="54" font-size="11.5" fill="#475569">Brief → Storyboard → First Cut</text>

    <rect x="14" y="68" width="234" height="30" rx="7" fill="#f8faf6" stroke="#e4ebe0"/>
    <circle cx="28" cy="83" r="3" fill="#65a30d"/>
    <text x="40" y="87" font-size="11.8" font-weight="500" fill="#1e293b">AI Director &amp; Creative Brief</text>

    <rect x="14" y="103" width="234" height="30" rx="7" fill="#f8faf6" stroke="#e4ebe0"/>
    <circle cx="28" cy="118" r="3" fill="#65a30d"/>
    <text x="40" y="122" font-size="11.8" font-weight="500" fill="#1e293b">Structured Shot Storyboard</text>

    <rect x="14" y="138" width="234" height="30" rx="7" fill="#f8faf6" stroke="#e4ebe0"/>
    <circle cx="28" cy="153" r="3" fill="#65a30d"/>
    <text x="40" y="157" font-size="11.8" font-weight="500" fill="#1e293b">Stock, AI Media &amp; Previz</text>

    <rect x="14" y="173" width="234" height="30" rx="7" fill="#ecfccb" stroke="#a3e635"/>
    <circle cx="28" cy="188" r="3" fill="#4d7c0f"/>
    <text x="40" y="192" font-size="11.8" font-weight="600" fill="#1a2e05">One-Click Timeline First Cut</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <line x1="294" y1="158" x2="313" y2="158" stroke="url(#wfl-arr1)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="311,152 320,158 311,164" fill="#0284c7"/>
  </g>

  <!-- STAGE 2: 02 REFINE -->
  <g transform="translate(322, 50)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="3" width="262" height="216" rx="14" fill="#1a2e05" fill-opacity="0.045"/>
    <g clip-path="url(#wfl-stage-clip)">
      <rect x="0" y="0" width="262" height="216" fill="#ffffff"/>
      <rect x="0" y="0" width="262" height="4" fill="#0284c7"/>
    </g>
    <rect x="0" y="0" width="262" height="216" rx="14" fill="none" stroke="#dce4d8" stroke-width="1.2"/>

    <rect x="16" y="16" width="44" height="20" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.9"/>
    <text x="38" y="29.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">02</text>
    <text x="70" y="31" font-size="16" font-weight="700" fill="#11161d">Refine</text>
    <text x="16" y="54" font-size="11.5" fill="#475569">Multi-Track NLE &amp; AI Editing</text>

    <rect x="14" y="68" width="234" height="30" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="28" cy="83" r="3" fill="#0284c7"/>
    <text x="40" y="87" font-size="11.8" font-weight="500" fill="#1e293b">Video, PiP, Captions &amp; Audio</text>

    <rect x="14" y="103" width="234" height="30" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="28" cy="118" r="3" fill="#0284c7"/>
    <text x="40" y="122" font-size="11.8" font-weight="500" fill="#1e293b">14 Color Looks, Masks &amp; FX</text>

    <rect x="14" y="138" width="234" height="30" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="28" cy="153" r="3" fill="#0284c7"/>
    <text x="40" y="157" font-size="11.8" font-weight="500" fill="#1e293b">Keyframes &amp; Speed Curves</text>

    <rect x="14" y="173" width="234" height="30" rx="7" fill="#e0f2fe" stroke="#7dd3fc"/>
    <circle cx="28" cy="188" r="3" fill="#0369a1"/>
    <text x="40" y="192" font-size="11.8" font-weight="600" fill="#0c4a6e">AI &amp; Local NLP Editing</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <line x1="588" y1="158" x2="607" y2="158" stroke="url(#wfl-arr2)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="605,152 614,158 605,164" fill="#7c3aed"/>
  </g>

  <!-- STAGE 3: 03 BREAKDOWN -->
  <g transform="translate(616, 50)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="3" width="262" height="216" rx="14" fill="#1a2e05" fill-opacity="0.045"/>
    <g clip-path="url(#wfl-stage-clip)">
      <rect x="0" y="0" width="262" height="216" fill="#ffffff"/>
      <rect x="0" y="0" width="262" height="4" fill="#7c3aed"/>
    </g>
    <rect x="0" y="0" width="262" height="216" rx="14" fill="none" stroke="#dce4d8" stroke-width="1.2"/>

    <rect x="16" y="16" width="44" height="20" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.9"/>
    <text x="38" y="29.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">03</text>
    <text x="70" y="31" font-size="16" font-weight="700" fill="#11161d">Breakdown</text>
    <text x="16" y="54" font-size="11.5" fill="#475569">Shot Analysis &amp; Technique Library</text>

    <rect x="14" y="68" width="234" height="30" rx="7" fill="#faf9ff" stroke="#e7e3f5"/>
    <circle cx="28" cy="83" r="3" fill="#7c3aed"/>
    <text x="40" y="87" font-size="11.8" font-weight="500" fill="#1e293b">Scene &amp; Dissolve Detection</text>

    <rect x="14" y="103" width="234" height="30" rx="7" fill="#faf9ff" stroke="#e7e3f5"/>
    <circle cx="28" cy="118" r="3" fill="#7c3aed"/>
    <text x="40" y="122" font-size="11.8" font-weight="500" fill="#1e293b">Dominant Color (MMCQ)</text>

    <rect x="14" y="138" width="234" height="30" rx="7" fill="#faf9ff" stroke="#e7e3f5"/>
    <circle cx="28" cy="153" r="3" fill="#7c3aed"/>
    <text x="40" y="157" font-size="11.8" font-weight="500" fill="#1e293b">Beat &amp; Loudness Analysis</text>

    <rect x="14" y="173" width="234" height="30" rx="7" fill="#ede9fe" stroke="#c4b5fd"/>
    <circle cx="28" cy="188" r="3" fill="#6d28d9"/>
    <text x="40" y="192" font-size="11.8" font-weight="600" fill="#4c1d95">Reusable Technique Cards</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g>
    <line x1="882" y1="158" x2="901" y2="158" stroke="url(#wfl-arr3)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="899,152 908,158 899,164" fill="#059669"/>
  </g>

  <!-- STAGE 4: 04 EXPORT -->
  <g transform="translate(910, 50)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="3" width="262" height="216" rx="14" fill="#1a2e05" fill-opacity="0.045"/>
    <g clip-path="url(#wfl-stage-clip)">
      <rect x="0" y="0" width="262" height="216" fill="#ffffff"/>
      <rect x="0" y="0" width="262" height="4" fill="#059669"/>
    </g>
    <rect x="0" y="0" width="262" height="216" rx="14" fill="none" stroke="#dce4d8" stroke-width="1.2"/>

    <rect x="16" y="16" width="44" height="20" rx="10" fill="#d1fae5" stroke="#6ee7b7" stroke-width="0.9"/>
    <text x="38" y="29.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#064e3b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">04</text>
    <text x="70" y="31" font-size="16" font-weight="700" fill="#11161d">Export</text>
    <text x="16" y="54" font-size="11.5" fill="#475569">Worker Pipeline &amp; LGPL FFmpeg</text>

    <rect x="14" y="68" width="234" height="30" rx="7" fill="#f5fbf8" stroke="#dceee4"/>
    <circle cx="28" cy="83" r="3" fill="#059669"/>
    <text x="40" y="87" font-size="11.8" font-weight="500" fill="#1e293b">Web Worker JPEG Pipeline</text>

    <rect x="14" y="103" width="234" height="30" rx="7" fill="#f5fbf8" stroke="#dceee4"/>
    <circle cx="28" cy="118" r="3" fill="#059669"/>
    <text x="40" y="122" font-size="11.8" font-weight="500" fill="#1e293b">HW H.264 (NVENC / QSV / AMF)</text>

    <rect x="14" y="138" width="234" height="30" rx="7" fill="#f5fbf8" stroke="#dceee4"/>
    <circle cx="28" cy="153" r="3" fill="#059669"/>
    <text x="40" y="157" font-size="11.8" font-weight="500" fill="#1e293b">MP4, MOV, GIF, MP3 &amp; WAV</text>

    <rect x="14" y="173" width="234" height="30" rx="7" fill="#d1fae5" stroke="#6ee7b7"/>
    <circle cx="28" cy="188" r="3" fill="#047857"/>
    <text x="40" y="192" font-size="11.8" font-weight="600" fill="#064e3b">SRT &amp; AIGC Compliance Tags</text>
  </g>

  <!-- Closed-Loop Dashed Feedback Arc (Breakdown -> Create & Refine AI) -->
  <g>
    <!-- Right leg from Breakdown down into feedback pill -->
    <path d="M 747 266 L 747 285 Q 747 293 739 293 L 621 293" fill="none" stroke="#7c3aed" stroke-opacity="0.62" stroke-width="1.5" stroke-dasharray="5 4"/>
    <!-- Left leg from feedback pill over and up into Create -->
    <path d="M 285 293 L 167 293 Q 159 293 159 285 L 159 274" fill="none" stroke="#7c3aed" stroke-opacity="0.62" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="154,276 159,267 164,276" fill="#7c3aed"/>
    <!-- Center upward branch from feedback pill into Refine -->
    <line x1="453" y1="282" x2="453" y2="274" stroke="#7c3aed" stroke-opacity="0.68" stroke-width="1.5" stroke-dasharray="3 2.5"/>
    <polygon points="448,276 453,267 458,276" fill="#7c3aed"/>
    <!-- Feedback Pill -->
    <rect x="285" y="282" width="336" height="22" rx="11" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.1"/>
    <text x="453" y="296.5" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Technique Cards feed back into Create &amp; Refine AI</text>
  </g>
</svg>
