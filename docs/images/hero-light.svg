<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="hero-light-title hero-light-desc">
  <title id="hero-light-title">Frameflow — Offline-First AI Video Workstation for Windows</title>
  <desc id="hero-light-desc">Offline-first AI video workstation for Windows — from storyboard direction and multi-track refinement to shot breakdown and LGPL FFmpeg export.</desc>
  <defs>
    <linearGradient id="hl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafbf9"/>
      <stop offset="55%" stop-color="#f6f9f3"/>
      <stop offset="100%" stop-color="#f1f5ee"/>
    </linearGradient>
    <linearGradient id="hl-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f6212"/>
      <stop offset="55%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="hl-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2026"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="hl-flow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fe870"/>
      <stop offset="55%" stop-color="#c8e250"/>
      <stop offset="100%" stop-color="#f1f7b0"/>
    </linearGradient>
    <linearGradient id="hl-flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b18cff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#5fb3ff" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="hl-lime-glow" cx="0.14" cy="0.38" r="0.34">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#a3e635" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fafbf9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hl-ai-glow" cx="0.86" cy="0.26" r="0.36">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#f1f5ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hl-clip">
      <rect x="4" y="4" width="1192" height="332" rx="18"/>
    </clipPath>
    <clipPath id="hl-nle-clip">
      <rect x="0" y="0" width="320" height="168" rx="14"/>
