    <!-- Brand Wordmark -->
    <text x="200" y="140" font-size="54" font-weight="800" letter-spacing="-1.6" fill="#11161d">Frame<tspan fill="url(#hl-accent)">flow</tspan></text>

    <!-- Crisp 2-Line Tagline -->
    <text x="202" y="177" font-size="15" font-weight="500" fill="#334155">Offline-first AI video workstation for Windows — from storyboard direction</text>
    <text x="202" y="201" font-size="15" font-weight="500" fill="#475569">&amp; multi-track refinement to shot breakdown and LGPL FFmpeg export.</text>
  </g>

