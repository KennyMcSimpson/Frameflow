      <rect x="956" y="14" width="16" height="5.5" rx="2"/>
      <rect x="996" y="14" width="16" height="5.5" rx="2"/>
      <rect x="1036" y="14" width="16" height="5.5" rx="2"/>
      <rect x="1076" y="14" width="16" height="5.5" rx="2"/>
      <rect x="1116" y="14" width="16" height="5.5" rx="2"/>
      <rect x="1156" y="14" width="16" height="5.5" rx="2"/>
