<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="wf-dark-title wf-dark-desc">
  <title id="wf-dark-title">Frameflow 4-Stage Video Production Workflow</title>
  <desc id="wf-dark-desc">Four-stage production pipeline: 01 Create, 02 Refine, 03 Breakdown, and 04 Export, with a closed-loop feedback path where Technique Cards feed back into Create and Refine AI.</desc>
  <defs>
    <linearGradient id="wfd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="wfd-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181c25"/>
      <stop offset="100%" stop-color="#12161d"/>
    </linearGradient>
    <linearGradient id="wfd-arr1" x1="292" y1="158" x2="314" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4ff3f"/>
      <stop offset="100%" stop-color="#6cb2ff"/>
    </linearGradient>
    <linearGradient id="wfd-arr2" x1="586" y1="158" x2="608" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6cb2ff"/>
      <stop offset="100%" stop-color="#9d8cff"/>
    </linearGradient>
    <linearGradient id="wfd-arr3" x1="880" y1="158" x2="902" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9d8cff"/>
      <stop offset="100%" stop-color="#4cc38a"/>
    </linearGradient>
    <clipPath id="wfd-outer-clip">
      <rect x="4" y="4" width="1192" height="312" rx="18"/>
    </clipPath>
    <clipPath id="wfd-stage-clip">
      <rect x="0" y="0" width="262" height="216" rx="14"/>
    </clipPath>
    <pattern id="wfd-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Card Canvas -->
  <g clip-path="url(#wfd-outer-clip)">
    <rect x="4" y="4" width="1192" height="312" fill="url(#wfd-bg)"/>
    <rect x="4" y="4" width="1192" height="312" fill="url(#wfd-grid)"/>
  </g>
  <rect x="4" y="4" width="1192" height="312" rx="18" fill="none" stroke="#242b35" stroke-width="1.5"/>
  <rect x="5.5" y="5.5" width="1189" height="309" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Header Strip -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <circle cx="33" cy="29.5" r="3.5" fill="#d4ff3f"/>
    <text x="45" y="33.5" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#d4ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">END-TO-END PRODUCTION WORKFLOW</text>
    <text x="1172" y="33.5" text-anchor="end" font-size="12" font-weight="500" fill="#9aa6b8">Create · Refine · Breakdown Library · Hardware-Accelerated Export</text>
  </g>

  <!-- STAGE 1: 01 CREATE -->
  <g transform="translate(28, 50)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g clip-path="url(#wfd-stage-clip)">
      <rect x="0" y="0" width="262" height="216" fill="url(#wfd-card)"/>
      <rect x="0" y="0" width="262" height="4" fill="#d4ff3f"/>
    </g>
    <rect x="0" y="0" width="262" height="216" rx="14" fill="none" stroke="#a3e635" stroke-opacity="0.40" stroke-width="1.2"/>

    <rect x="16" y="16" width="44" height="20" rx="10" fill="#d4ff3f" fill-opacity="0.14"/>
    <text x="38" y="29.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#d4ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">01</text>
    <text x="70" y="31" font-size="16" font-weight="700" fill="#f4f7fb">Create</text>
    <text x="16" y="54" font-size="11.5" fill="#9aa6b8">Brief → Storyboard → First Cut</text>

    <rect x="14" y="68" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="83" r="3" fill="#d4ff3f"/>
    <text x="40" y="87" font-size="11.8" font-weight="500" fill="#e6ecf5">AI Director &amp; Creative Brief</text>

    <rect x="14" y="103" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="118" r="3" fill="#d4ff3f"/>
    <text x="40" y="122" font-size="11.8" font-weight="500" fill="#e6ecf5">Structured Shot Storyboard</text>

    <rect x="14" y="138" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="153" r="3" fill="#d4ff3f"/>
    <text x="40" y="157" font-size="11.8" font-weight="500" fill="#e6ecf5">Stock, AI Media &amp; Previz</text>

    <rect x="14" y="173" width="234" height="30" rx="7" fill="#1a2212" stroke="#a3e635" stroke-opacity="0.38"/>
    <circle cx="28" cy="188" r="3" fill="#d4ff3f"/>
    <text x="40" y="192" font-size="11.8" font-weight="600" fill="#e8ff8c">One-Click Timeline First Cut</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <line x1="294" y1="158" x2="313" y2="158" stroke="url(#wfd-arr1)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="311,152 320,158 311,164" fill="#6cb2ff"/>
  </g>

  <!-- STAGE 2: 02 REFINE -->
  <g transform="translate(322, 50)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g clip-path="url(#wfd-stage-clip)">
      <rect x="0" y="0" width="262" height="216" fill="url(#wfd-card)"/>
      <rect x="0" y="0" width="262" height="4" fill="#6cb2ff"/>
    </g>
    <rect x="0" y="0" width="262" height="216" rx="14" fill="none" stroke="#6cb2ff" stroke-opacity="0.40" stroke-width="1.2"/>

    <rect x="16" y="16" width="44" height="20" rx="10" fill="#6cb2ff" fill-opacity="0.16"/>
    <text x="38" y="29.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7ec0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">02</text>
    <text x="70" y="31" font-size="16" font-weight="700" fill="#f4f7fb">Refine</text>
    <text x="16" y="54" font-size="11.5" fill="#9aa6b8">Multi-Track NLE &amp; AI Editing</text>

    <rect x="14" y="68" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="83" r="3" fill="#6cb2ff"/>
    <text x="40" y="87" font-size="11.8" font-weight="500" fill="#e6ecf5">Video, PiP, Captions &amp; Audio</text>

    <rect x="14" y="103" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="118" r="3" fill="#6cb2ff"/>
    <text x="40" y="122" font-size="11.8" font-weight="500" fill="#e6ecf5">14 Color Looks, Masks &amp; FX</text>

    <rect x="14" y="138" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="153" r="3" fill="#6cb2ff"/>
    <text x="40" y="157" font-size="11.8" font-weight="500" fill="#e6ecf5">Keyframes &amp; Speed Curves</text>

    <rect x="14" y="173" width="234" height="30" rx="7" fill="#131d2b" stroke="#6cb2ff" stroke-opacity="0.38"/>
    <circle cx="28" cy="188" r="3" fill="#6cb2ff"/>
    <text x="40" y="192" font-size="11.8" font-weight="600" fill="#aed4ff">AI &amp; Local NLP Editing</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <line x1="588" y1="158" x2="607" y2="158" stroke="url(#wfd-arr2)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="605,152 614,158 605,164" fill="#9d8cff"/>
  </g>

  <!-- STAGE 3: 03 BREAKDOWN -->
  <g transform="translate(616, 50)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g clip-path="url(#wfd-stage-clip)">
      <rect x="0" y="0" width="262" height="216" fill="url(#wfd-card)"/>
      <rect x="0" y="0" width="262" height="4" fill="#9d8cff"/>
    </g>
    <rect x="0" y="0" width="262" height="216" rx="14" fill="none" stroke="#9d8cff" stroke-opacity="0.42" stroke-width="1.2"/>

    <rect x="16" y="16" width="44" height="20" rx="10" fill="#9d8cff" fill-opacity="0.18"/>
    <text x="38" y="29.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b8adff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">03</text>
    <text x="70" y="31" font-size="16" font-weight="700" fill="#f4f7fb">Breakdown</text>
    <text x="16" y="54" font-size="11.5" fill="#9aa6b8">Shot Analysis &amp; Technique Library</text>

    <rect x="14" y="68" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="83" r="3" fill="#9d8cff"/>
    <text x="40" y="87" font-size="11.8" font-weight="500" fill="#e6ecf5">Scene &amp; Dissolve Detection</text>

    <rect x="14" y="103" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="118" r="3" fill="#9d8cff"/>
    <text x="40" y="122" font-size="11.8" font-weight="500" fill="#e6ecf5">Dominant Color (MMCQ)</text>

    <rect x="14" y="138" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="153" r="3" fill="#9d8cff"/>
    <text x="40" y="157" font-size="11.8" font-weight="500" fill="#e6ecf5">Beat &amp; Loudness Analysis</text>

    <rect x="14" y="173" width="234" height="30" rx="7" fill="#1d1831" stroke="#9d8cff" stroke-opacity="0.40"/>
    <circle cx="28" cy="188" r="3" fill="#b8adff"/>
    <text x="40" y="192" font-size="11.8" font-weight="600" fill="#d4ccff">Reusable Technique Cards</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g>
    <line x1="882" y1="158" x2="901" y2="158" stroke="url(#wfd-arr3)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="899,152 908,158 899,164" fill="#4cc38a"/>
  </g>

  <!-- STAGE 4: 04 EXPORT -->
  <g transform="translate(910, 50)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g clip-path="url(#wfd-stage-clip)">
      <rect x="0" y="0" width="262" height="216" fill="url(#wfd-card)"/>
      <rect x="0" y="0" width="262" height="4" fill="#4cc38a"/>
    </g>
    <rect x="0" y="0" width="262" height="216" rx="14" fill="none" stroke="#4cc38a" stroke-opacity="0.42" stroke-width="1.2"/>

    <rect x="16" y="16" width="44" height="20" rx="10" fill="#4cc38a" fill-opacity="0.16"/>
    <text x="38" y="29.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5fd69e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">04</text>
    <text x="70" y="31" font-size="16" font-weight="700" fill="#f4f7fb">Export</text>
    <text x="16" y="54" font-size="11.5" fill="#9aa6b8">Worker Pipeline &amp; LGPL FFmpeg</text>

    <rect x="14" y="68" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="83" r="3" fill="#4cc38a"/>
    <text x="40" y="87" font-size="11.8" font-weight="500" fill="#e6ecf5">Web Worker JPEG Pipeline</text>

    <rect x="14" y="103" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="118" r="3" fill="#4cc38a"/>
    <text x="40" y="122" font-size="11.8" font-weight="500" fill="#e6ecf5">HW H.264 (NVENC / QSV / AMF)</text>

    <rect x="14" y="138" width="234" height="30" rx="7" fill="#0e1218" stroke="#ffffff" stroke-opacity="0.065"/>
    <circle cx="28" cy="153" r="3" fill="#4cc38a"/>
    <text x="40" y="157" font-size="11.8" font-weight="500" fill="#e6ecf5">MP4, MOV, GIF, MP3 &amp; WAV</text>

    <rect x="14" y="173" width="234" height="30" rx="7" fill="#12271f" stroke="#4cc38a" stroke-opacity="0.40"/>
    <circle cx="28" cy="188" r="3" fill="#4cc38a"/>
    <text x="40" y="192" font-size="11.8" font-weight="600" fill="#8eedbf">SRT &amp; AIGC Compliance Tags</text>
  </g>

  <!-- Closed-Loop Dashed Feedback Arc (Breakdown -> Create & Refine AI) -->
  <g>
    <!-- Right leg from Breakdown down into feedback pill -->
    <path d="M 747 266 L 747 285 Q 747 293 739 293 L 621 293" fill="none" stroke="#9d8cff" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="5 4"/>
    <!-- Left leg from feedback pill over and up into Create -->
    <path d="M 285 293 L 167 293 Q 159 293 159 285 L 159 274" fill="none" stroke="#9d8cff" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="154,276 159,267 164,276" fill="#9d8cff"/>
    <!-- Center upward branch from feedback pill into Refine -->
    <line x1="453" y1="282" x2="453" y2="274" stroke="#9d8cff" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="3 2.5"/>
    <polygon points="448,276 453,267 458,276" fill="#9d8cff"/>
    <!-- Feedback Pill -->
    <rect x="285" y="282" width="336" height="22" rx="11" fill="#171628" stroke="#9d8cff" stroke-opacity="0.48" stroke-width="1.1"/>
    <text x="453" y="296.5" text-anchor="middle" font-size="11" font-weight="600" fill="#d0c7ff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Technique Cards feed back into Create &amp; Refine AI</text>
  </g>
</svg>
