      <text x="14" y="69">V1</text>
      <text x="14" y="101">FX</text>
      <text x="14" y="134">A1</text>
    </g>

    <!-- V1 Video Clips -->
    <rect x="44" y="54" width="76" height="22" rx="5" fill="#223b4e" stroke="#5788ab" stroke-width="1"/>
    <rect x="124" y="54" width="94" height="22" rx="5" fill="#2e526b" stroke="#d4ff3f" stroke-width="1.3"/>
    <rect x="222" y="54" width="84" height="22" rx="5" fill="#223b4e" stroke="#5788ab" stroke-width="1"/>

    <!-- FX / Captions Clips -->
    <rect x="64" y="86" width="88" height="22" rx="5" fill="#3a3066" stroke="#9d8cff" stroke-width="1"/>
    <rect x="176" y="86" width="108" height="22" rx="5" fill="#523d26" stroke="#f0b44c" stroke-width="1"/>

    <!-- A1 Audio Track + Waveform -->
    <rect x="44" y="118" width="262" height="24" rx="5" fill="#173a2e" stroke="#4cc38a" stroke-width="1"/>
    <g fill="#4cc38a" opacity="0.78">
      <rect x="54" y="128" width="3" height="6" rx="1"/>
      <rect x="62" y="124" width="3" height="12" rx="1"/>
