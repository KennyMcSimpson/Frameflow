  <!-- 4 Balanced Capability Pills (x=44..1156, optically centered) -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <!-- Pill 1 -->
    <rect x="44" y="262" width="224" height="44" rx="22" fill="url(#hd-pill)" stroke="#a3e635" stroke-opacity="0.42" stroke-width="1.2"/>
    <circle cx="80" cy="284" r="4.5" fill="#d4ff3f"/>
    <text x="94" y="288.5" fill="#f4f7fb">Storyboard &amp; AI Director</text>

    <!-- Pill 2 -->
    <rect x="282" y="262" width="224" height="44" rx="22" fill="url(#hd-pill)" stroke="#6cb2ff" stroke-opacity="0.42" stroke-width="1.2"/>
    <circle cx="318" cy="284" r="4.5" fill="#6cb2ff"/>
    <text x="332" y="288.5" fill="#f4f7fb">Multi-Track NLE Timeline</text>

    <!-- Pill 3 -->
    <rect x="520" y="262" width="292" height="44" rx="22" fill="url(#hd-pill)" stroke="#9d8cff" stroke-opacity="0.44" stroke-width="1.2"/>
    <circle cx="556" cy="284" r="4.5" fill="#9d8cff"/>
