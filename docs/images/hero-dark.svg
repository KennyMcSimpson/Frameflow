<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="hero-dark-title hero-dark-desc">
  <title id="hero-dark-title">Frameflow — Offline-First AI Video Workstation for Windows</title>
  <desc id="hero-dark-desc">Offline-first AI video workstation for Windows — from storyboard direction and multi-track refinement to shot breakdown and LGPL FFmpeg export.</desc>
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/>
      <stop offset="52%" stop-color="#10141b"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="hd-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4ff3f"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="hd-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2026"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="hd-flow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fe870"/>
      <stop offset="55%" stop-color="#c8e250"/>
      <stop offset="100%" stop-color="#f1f7b0"/>
    </linearGradient>
    <linearGradient id="hd-flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b18cff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#5fb3ff" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="hd-lime-glow" cx="0.14" cy="0.38" r="0.34">
      <stop offset="0%" stop-color="#d4ff3f" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#a3e635" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d0f12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hd-ai-glow" cx="0.86" cy="0.26" r="0.36">
      <stop offset="0%" stop-color="#9d8cff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#5fb3ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#141820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hd-pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a202a"/>
      <stop offset="100%" stop-color="#13171f"/>
    </linearGradient>
    <linearGradient id="hd-nle-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12161e"/>
      <stop offset="100%" stop-color="#0d1016"/>
    </linearGradient>
    <clipPath id="hd-clip">
      <rect x="4" y="4" width="1192" height="332" rx="18"/>
    </clipPath>
    <pattern id="hd-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.024" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Obsidian Studio Canvas -->
  <g clip-path="url(#hd-clip)">
    <rect x="4" y="4" width="1192" height="332" fill="url(#hd-bg)"/>
    <rect x="4" y="4" width="1192" height="332" fill="url(#hd-grid)"/>
    <rect x="4" y="4" width="1192" height="332" fill="url(#hd-lime-glow)"/>
    <rect x="4" y="4" width="1192" height="332" fill="url(#hd-ai-glow)"/>

    <!-- Subtle top filmstrip sprocket track motif -->
    <g fill="#ffffff" fill-opacity="0.045">
      <rect x="36" y="14" width="16" height="5.5" rx="2"/>
      <rect x="76" y="14" width="16" height="5.5" rx="2"/>
      <rect x="116" y="14" width="16" height="5.5" rx="2"/>
      <rect x="156" y="14" width="16" height="5.5" rx="2"/>
      <rect x="196" y="14" width="16" height="5.5" rx="2"/>
      <rect x="236" y="14" width="16" height="5.5" rx="2"/>
      <rect x="276" y="14" width="16" height="5.5" rx="2"/>
      <rect x="316" y="14" width="16" height="5.5" rx="2"/>
      <rect x="356" y="14" width="16" height="5.5" rx="2"/>
      <rect x="396" y="14" width="16" height="5.5" rx="2"/>
      <rect x="436" y="14" width="16" height="5.5" rx="2"/>
      <rect x="476" y="14" width="16" height="5.5" rx="2"/>
      <rect x="516" y="14" width="16" height="5.5" rx="2"/>
      <rect x="556" y="14" width="16" height="5.5" rx="2"/>
      <rect x="596" y="14" width="16" height="5.5" rx="2"/>
      <rect x="636" y="14" width="16" height="5.5" rx="2"/>
      <rect x="676" y="14" width="16" height="5.5" rx="2"/>
      <rect x="716" y="14" width="16" height="5.5" rx="2"/>
      <rect x="756" y="14" width="16" height="5.5" rx="2"/>
      <rect x="796" y="14" width="16" height="5.5" rx="2"/>
      <rect x="836" y="14" width="16" height="5.5" rx="2"/>
      <rect x="876" y="14" width="16" height="5.5" rx="2"/>
      <rect x="916" y="14" width="16" height="5.5" rx="2"/>
      <rect x="956" y="14" width="16" height="5.5" rx="2"/>
      <rect x="996" y="14" width="16" height="5.5" rx="2"/>
      <rect x="1036" y="14" width="16" height="5.5" rx="2"/>
      <rect x="1076" y="14" width="16" height="5.5" rx="2"/>
      <rect x="1116" y="14" width="16" height="5.5" rx="2"/>
      <rect x="1156" y="14" width="16" height="5.5" rx="2"/>
    </g>

    <!-- Studio divider above capability pills -->
    <line x1="44" y1="240" x2="1156" y2="240" stroke="#ffffff" stroke-opacity="0.075" stroke-width="1"/>
  </g>

  <!-- Crisp Outer Card Border -->
  <rect x="4" y="4" width="1192" height="332" rx="18" fill="none" stroke="#242b35" stroke-width="1.5"/>
  <rect x="5.5" y="5.5" width="1189" height="329" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>

  <!-- Geometric Frameflow Icon Mark (matching build/icon.svg) -->
  <g transform="translate(46, 62) scale(0.255)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#hd-icon-bg)"/>
    <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#2c313b" stroke-width="22"/>
    <g fill="none" stroke="#3b414d" stroke-width="10" stroke-linecap="round">
      <path d="M256 128 L318 238"/>
      <path d="M366 192 L294 290"/>
      <path d="M370 320 L250 322"/>
      <path d="M256 384 L194 274"/>
      <path d="M146 320 L218 222"/>
      <path d="M142 192 L262 190"/>
    </g>
    <path d="M70 300 C 150 220, 220 360, 300 270 S 420 190, 450 220" fill="none" stroke="url(#hd-flow2)" stroke-width="20" stroke-linecap="round" opacity="0.88"/>
    <path d="M62 250 C 150 160, 214 330, 298 236 S 418 150, 452 176" fill="none" stroke="url(#hd-flow1)" stroke-width="40" stroke-linecap="round"/>
    <g fill="#15170b" opacity="0.58">
