      <rect x="166" y="127" width="3" height="7" rx="1"/>
      <rect x="174" y="121" width="3" height="17" rx="1"/>
      <rect x="182" y="124" width="3" height="12" rx="1"/>
      <rect x="190" y="126" width="3" height="8" rx="1"/>
      <rect x="198" y="122" width="3" height="15" rx="1"/>
      <rect x="206" y="125" width="3" height="10" rx="1"/>
      <rect x="214" y="120" width="3" height="18" rx="1"/>
