      <rect x="398" y="176" width="14" height="10" rx="3" transform="rotate(-18 405 181)"/>
    </g>
  </g>

  <!-- Title, Pill Badge & Tagline -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Pill Badge -->
    <rect x="202" y="54" width="354" height="26" rx="13" fill="#d4ff3f" fill-opacity="0.09" stroke="#a3e635" stroke-opacity="0.36" stroke-width="1"/>
    <circle cx="218" cy="67" r="3.5" fill="#d4ff3f"/>
    <text x="230" y="70.5" font-size="10.5" font-weight="600" letter-spacing="1.0" fill="#d4ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">LOCAL-FIRST DESKTOP WORKSTATION · WINDOWS x64</text>

    <!-- Brand Wordmark -->
    <text x="200" y="140" font-size="54" font-weight="800" letter-spacing="-1.6" fill="#f4f7fb">Frame<tspan fill="url(#hd-accent)">flow</tspan></text>

    <!-- Crisp 2-Line Tagline -->
    <text x="202" y="177" font-size="15" font-weight="500" fill="#d3dce8">Offline-first AI video workstation for Windows — from storyboard direction</text>
    <text x="202" y="201" font-size="15" font-weight="500" fill="#9aa6b8">&amp; multi-track refinement to shot breakdown and LGPL FFmpeg export.</text>
  </g>

  <!-- Sleek Mini NLE Timeline Graphic (Right) -->
  <g transform="translate(836, 46)">
    <rect x="0" y="0" width="320" height="168" rx="14" fill="url(#hd-nle-bg)" stroke="#242b35" stroke-width="1.2"/>
    <line x1="1" y1="30" x2="319" y2="30" stroke="#ffffff" stroke-opacity="0.065" stroke-width="1"/>
    <circle cx="16" cy="15" r="3.5" fill="#f2555a" opacity="0.8"/>
    <circle cx="28" cy="15" r="3.5" fill="#f0b44c" opacity="0.8"/>
    <circle cx="40" cy="15" r="3.5" fill="#4cc38a" opacity="0.8"/>
    <text x="58" y="19" font-size="10.5" font-weight="600" fill="#9aa6b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">TIMELINE · 1080p 30fps</text>
    <text x="305" y="19" text-anchor="end" font-size="10.5" font-weight="700" fill="#d4ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">00:14:22</text>

    <!-- Ruler Ticks -->
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1">
      <line x1="46" y1="38" x2="46" y2="44"/>
      <line x1="90" y1="38" x2="90" y2="46"/>
      <line x1="134" y1="38" x2="134" y2="44"/>
      <line x1="178" y1="38" x2="178" y2="46"/>
      <line x1="222" y1="38" x2="222" y2="44"/>
      <line x1="266" y1="38" x2="266" y2="46"/>
      <line x1="304" y1="38" x2="304" y2="44"/>
    </g>

    <!-- Track Labels -->
