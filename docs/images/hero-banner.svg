      <rect x="166" y="127" width="3" height="7" rx="1"/>
      <rect x="174" y="121" width="3" height="17" rx="1"/>
      <rect x="182" y="124" width="3" height="12" rx="1"/>
      <rect x="190" y="126" width="3" height="8" rx="1"/>
      <rect x="198" y="122" width="3" height="15" rx="1"/>
      <rect x="206" y="125" width="3" height="10" rx="1"/>
      <rect x="214" y="120" width="3" height="18" rx="1"/>
      <rect x="222" y="124" width="3" height="12" rx="1"/>
      <rect x="230" y="127" width="3" height="7" rx="1"/>
      <rect x="238" y="123" width="3" height="14" rx="1"/>
      <rect x="246" y="126" width="3" height="8" rx="1"/>
      <rect x="254" y="122" width="3" height="16" rx="1"/>
      <rect x="262" y="125" width="3" height="10" rx="1"/>
      <rect x="270" y="127" width="3" height="6" rx="1"/>
      <rect x="278" y="123" width="3" height="14" rx="1"/>
      <rect x="286" y="126" width="3" height="8" rx="1"/>
      <rect x="294" y="128" width="3" height="5" rx="1"/>
    </g>

    <!-- Playhead -->
    <polygon points="164,34 172,34 168,42" fill="#d4ff3f"/>
    <line x1="168" y1="42" x2="168" y2="154" stroke="#d4ff3f" stroke-width="1.6"/>
  </g>

  <!-- 4 Capability Pills (Mathematically spaced across x=44..1156) -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
    <!-- Pill 1: Storyboard & AI Director -->
    <rect x="44" y="264" width="220" height="44" rx="22" fill="url(#pillBg)" stroke="#c8e250" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="66" cy="286" r="4.5" fill="#d4ff3f"/>
    <text x="80" y="290.5" fill="#edf0f5">Storyboard &amp; AI Director</text>

    <!-- Pill 2: Multi-Track NLE Timeline -->
    <rect x="278" y="264" width="220" height="44" rx="22" fill="url(#pillBg)" stroke="#6cb2ff" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="300" cy="286" r="4.5" fill="#6cb2ff"/>
    <text x="314" y="290.5" fill="#edf0f5">Multi-Track NLE Timeline</text>

    <!-- Pill 3: Shot Breakdown & Technique Library -->
    <rect x="512" y="264" width="296" height="44" rx="22" fill="url(#pillBg)" stroke="#9d8cff" stroke-opacity="0.42" stroke-width="1.2"/>
    <circle cx="534" cy="286" r="4.5" fill="#9d8cff"/>
    <text x="548" y="290.5" fill="#edf0f5">Shot Breakdown &amp; Technique Library</text>

    <!-- Pill 4: Hardware-Accelerated LGPL FFmpeg Export -->
    <rect x="822" y="264" width="334" height="44" rx="22" fill="url(#pillBg)" stroke="#4cc38a" stroke-opacity="0.42" stroke-width="1.2"/>
    <circle cx="844" cy="286" r="4.5" fill="#4cc38a"/>
    <text x="858" y="290.5" fill="#edf0f5">Hardware-Accelerated LGPL FFmpeg Export</text>
  </g>
